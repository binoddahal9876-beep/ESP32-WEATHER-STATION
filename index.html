<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Weather Station Dashboard</title>
    
    <!-- Native App Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Your 180x180 App Icon -->
    <link rel="manifest" href="manifest.json?v=fresh">
    <link rel="icon" type="image/png" sizes="180x180" href="icon.png?v=fresh">
    <link rel="apple-touch-icon" href="icon.png?v=fresh">

    <!-- Free Open-Source Map Styles (Leaflet) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #4CAF50; }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }
        
        .card {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            border-top: 4px solid;
        }
        
        #card-temp { border-color: #f44336; }
        #card-hum { border-color: #2196F3; }
        #card-pres { border-color: #ff9800; }
        #card-alt { border-color: #9c27b0; }

        .value { font-size: 2em; font-weight: bold; margin: 10px 0; }
        .label { color: #aaaaaa; font-size: 0.9em; text-transform: uppercase; }
        .timestamp { color: #888; font-size: 0.8em; margin-bottom: 20px; }

        #map {
            height: 400px;
            width: 100%;
            max-width: 900px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1; 
        }
    </style>
</head>
<body>

    <h1>🛰️ ESP32 Weather Station</h1>
    <div class="timestamp" id="last-updated">Waiting for data...</div>

    <div class="dashboard">
        <div class="card" id="card-temp">
            <div class="label">Temperature</div>
            <div class="value" id="val-temp">-- °C</div>
        </div>
        <div class="card" id="card-hum">
            <div class="label">Humidity</div>
            <div class="value" id="val-hum">-- %</div>
        </div>
        <div class="card" id="card-pres">
            <div class="label">Pressure</div>
            <div class="value" id="val-pres">-- hPa</div>
        </div>
        <div class="card" id="card-alt">
            <div class="label">Altitude</div>
            <div class="value" id="val-alt">-- m</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Your ThingSpeak Channel ID
        const CHANNEL_ID = "3457990"; 
        
        const map = L.map('map').setView([0, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);
        
        let marker = L.marker([0, 0]).addTo(map);

        async function fetchData() {
            try {
                const response = await fetch(`https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds/last.json`);
                
                if (!response.ok) {
                   document.getElementById('last-updated').innerText = "Channel active, but no data received yet. Power on your ESP32!";
                   return;
                }
                
                const data = await response.json();

                if(!data || Object.keys(data).length === 0 || data === "-1") {
                    document.getElementById('last-updated').innerText = "Waiting for the first data point from the ESP32...";
                    return;
                }

                document.getElementById('val-temp').innerText = data.field1 ? parseFloat(data.field1).toFixed(1) + ' °C' : '-- °C';
                document.getElementById('val-hum').innerText = data.field2 ? parseFloat(data.field2).toFixed(1) + ' %' : '-- %';
                document.getElementById('val-pres').innerText = data.field3 ? parseFloat(data.field3).toFixed(1) + ' hPa' : '-- hPa';
                document.getElementById('val-alt').innerText = data.field4 ? parseFloat(data.field4).toFixed(1) + ' m' : '-- m';

                const lat = parseFloat(data.field5);
                const lon = parseFloat(data.field6);
                
                if (!isNaN(lat) && !isNaN(lon) && lat !== 0) {
                    const newLatLng = new L.LatLng(lat, lon);
                    marker.setLatLng(newLatLng);
                    map.setView(newLatLng, 15);
                }

                const date = new Date(data.created_at);
                document.getElementById('last-updated').innerText = "Last Updated: " + date.toLocaleString();

            } catch (error) {
                console.error("Error fetching data: ", error);
            }
        }

        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
